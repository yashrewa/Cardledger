services:
  postgres:
    image: postgres:16-alpine
    container_name: cardledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardledger
      POSTGRES_PASSWORD: cardledger
      POSTGRES_DB: cardledger
    ports:
      - "5432:5432"
    volumes:
      - cardledger_pg_data:/var/lib/postgresql/data

volumes:
  cardledger_pg_data:
